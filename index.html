<!DOCTYPE html>
<html>
<head>
  <title>Pacman Q-learning</title>
  <style>
    body { background: #111; color: white; font-family: Arial; text-align: center; }
    canvas { background: #0a0a28; }
  </style>
</head>
<body>
  <h2>Pacman Q-learning</h2>
  <p id="info">Training, please wait...</p>
  <canvas id="game" width="500" height="500"></canvas>

  <script>
    var SIZE = 10;
    var CELL = 50;
    var MAX_STEPS = 120;
    var ALPHA = 0.1;
    var GAMMA = 0.95;
    var MOVES = [[-1, 0], [1, 0], [0, -1], [0, 1]];

    var Q = {};

    var canvas = document.getElementById("game");
    var ctx = canvas.getContext("2d");
    var info = document.getElementById("info");

    function clamp(n) {
      return Math.min(Math.max(n, 0), SIZE - 1);
    }

    function newGame() {
      return {
        pac: [0, 0],
        ghost: [9, 9],
        pellets: [[0, 9], [9, 0], [4, 4], [2, 7], [7, 2], [5, 5]]
      };
    }

    function same(a, b) {
      return a[0] == b[0] && a[1] == b[1];
    }

    // returns [newState, reward, gameOver]
    function step(state, action) {
      var pac = [clamp(state.pac[0] + MOVES[action][0]), clamp(state.pac[1] + MOVES[action][1])];
      var ghost = state.ghost;
      var pellets = state.pellets;
      var reward = -1;

      // ate a pellet?
      var left = [];
      for (var i = 0; i < pellets.length; i++) {
        if (same(pellets[i], pac)) {
          reward += 10;
        } else {
          left.push(pellets[i]);
        }
      }
      pellets = left;

      if (same(pac, ghost)) {
        return [{ pac: pac, ghost: ghost, pellets: pellets }, reward - 50, true];
      }
      if (pellets.length == 0) {
        return [{ pac: pac, ghost: ghost, pellets: pellets }, reward + 50, true];
      }

      // ghost moves randomly
      var m = MOVES[Math.floor(Math.random() * 4)];
      ghost = [clamp(ghost[0] + m[0]), clamp(ghost[1] + m[1])];
      if (same(pac, ghost)) {
        return [{ pac: pac, ghost: ghost, pellets: pellets }, reward - 50, true];
      }
      return [{ pac: pac, ghost: ghost, pellets: pellets }, reward, false];
    }

    // turn a state into a string so we can use it as a key
    function getKey(state) {
      return state.pac + "|" + state.ghost + "|" + state.pellets;
    }

    function getQ(state) {
      var k = getKey(state);
      if (!Q[k]) {
        Q[k] = [0, 0, 0, 0];
      }
      return Q[k];
    }

    function chooseAction(state, epsilon) {
      if (Math.random() < epsilon) {
        return Math.floor(Math.random() * 4);
      }
      var values = getQ(state);
      var best = Math.max.apply(null, values);
      var options = [];
      for (var a = 0; a < 4; a++) {
        if (values[a] == best) options.push(a);
      }
      return options[Math.floor(Math.random() * options.length)];
    }

    function learn(state, action, reward, nextState, over) {
      var future = 0;
      if (!over) {
        future = Math.max.apply(null, getQ(nextState));
      }
      var target = reward + GAMMA * future;
      var values = getQ(state);
      values[action] += ALPHA * (target - values[action]);
    }

    // plays one game, returns true if pacman won
    function playEpisode(epsilon, training) {
      var state = newGame();
      for (var i = 0; i < MAX_STEPS; i++) {
        var action = chooseAction(state, epsilon);
        var result = step(state, action);
        if (training) {
          learn(state, action, result[1], result[0], result[2]);
        }
        state = result[0];
        if (result[2]) break;
      }
      return state.pellets.length == 0 && !same(state.pac, state.ghost);
    }

    function train(episodes) {
      for (var ep = 1; ep <= episodes; ep++) {
        var epsilon = Math.max(0.05, 1 - ep / (episodes * 0.7));
        playEpisode(epsilon, true);

        if (ep % 5000 == 0) {
          var wins = 0;
          for (var i = 0; i < 200; i++) {
            if (playEpisode(0, false)) wins++;
          }
          console.log("game " + ep + " | win rate: " + (wins / 2) + "%");
        }
      }
    }

    function draw(state) {
      ctx.fillStyle = "#0a0a28";
      ctx.fillRect(0, 0, 500, 500);

      // pellets
      ctx.fillStyle = "white";
      for (var i = 0; i < state.pellets.length; i++) {
        var p = state.pellets[i];
        ctx.beginPath();
        ctx.arc(p[1] * CELL + 25, p[0] * CELL + 25, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // pacman
      ctx.fillStyle = "yellow";
      ctx.beginPath();
      ctx.arc(state.pac[1] * CELL + 25, state.pac[0] * CELL + 25, 21, 0, Math.PI * 2);
      ctx.fill();

     
      ctx.fillStyle = "red";
      ctx.fillRect(state.ghost[1] * CELL + 8, state.ghost[0] * CELL + 8, 34, 34);
    }

    // watch the trained pacman play forever
    var state = newGame();
    var steps = 0;

    function tick() {
      var action = chooseAction(state, 0);
      var result = step(state, action);
      state = result[0];
      steps++;
      draw(state);

      if (result[2] || steps >= MAX_STEPS) {
        setTimeout(function () {
          state = newGame();
          steps = 0;
          tick();
        }, 700);
      } else {
        setTimeout(tick, 170);
      }
    }

    train(60000);
    info.innerHTML = "Done training. Watching Pacman play.";
    tick();
  </script>
</body>
</html>
